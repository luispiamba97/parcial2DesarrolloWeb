<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disney - Educational Project</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>


  <nav class="navbar">
    <div class="nav-left">
      <img src="logo.png" alt="Disney Logo" class="logo">
      <ul class="nav-links">
        <li><a href="#">DISNEY+</a></li>
        <li><a href="#parks-and-travel">PARKS & TRAVEL</a></li>
        <li><a href="#movies">MOVIES</a></li>
        <li><a href="#shop">SHOP</a></li>
        <li><a href="#more">MORE</a></li>
      </ul>
    </div>
    <div class="nav-right">
      <a href="#" class="login-btn">LOG IN</a>
      <div class="search-container">
        <input type="text" placeholder="Search" class="search-input">
      </div>
    </div>
  </nav>

  <section class="banner" style="background-image: url('banner-background.jpg');">
    <div class="banner-content">
      <span class="banner-subtitle">Experience Snow White, now streaming in theaters!</span>
      <div class="banner-buttons">
        <a href="#" class="btn primary">Get Early Access</a>
        <a href="#" class="btn secondary">Learn More</a>
      </div>
    </div>
  </section>

  <main>
 
    <section id="shop">
      <!-- 4 tarjetas con fondo morado -->
    </section>

    <section id="disney-plus">
      <!-- Tarjetas anchas de Moana 2, Daredevil, etc. -->
    </section>

    <section id="movies">
      <!-- Pósters verticales de Coming Soon -->
    </section>

    <section id="parks-and-travel">
      <!-- Tarjetas horizontales de Disneyland -->
    </section>

  
    <section id="more" style="background-image: url('more-background.jpg');">
      <!-- Collage de tarjetas de crédito y texto de ofertas -->
    </section>
  </main>

  <footer>
    <div class="footer-content">
      <img src="logo.png" alt="Disney Logo Footer" class="footer-logo">
      <ul class="footer-links">
        <li><a href="#">Disney+</a></li>
        <li><a href="#">Privacy Policy</a></li>
        <li><a href="#">Terms of Use</a></li>
        <li><a href="#">Help</a></li>
      </ul>
      <p class="copyright">© 2026 MARVEL © Disney and its related entities. Member FDIC</p>
    </div>
  </footer>

</body>
</html>
